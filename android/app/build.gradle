plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.voiceagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.voiceagent"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // debug-signed release APK: installable directly
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
